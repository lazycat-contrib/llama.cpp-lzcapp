version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/community.lazycat.app.llama-cpp.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: llama-cpp
    bump: patch

build:
  run_buildscript: false

images:
  - id: llama-cpp
    target: service
    service: llama-cpp
    source: ghcr.io/ggml-org/llama.cpp
    channel: custom
    sort: created
    tag_regex: '^server-vulkan-[A-Za-z0-9._-]+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: false
    changelog_locales: [zh, en]
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
  private:
    enabled: true
    skip_if_version_exists: true
    name: Llama.cpp
    summary: Published from GitHub Actions
