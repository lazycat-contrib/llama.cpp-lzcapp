application:
  background_task: true
  gpu_accel: true
  subdomain: llamacpp
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://llama-cpp:15730/
services:
  llama-cpp:
    # upstream: ghcr.io/ggml-org/llama.cpp:server-vulkan-b11096@sha256:3e2a76015a1a22b568301d644403f5a9bd5d5e237ec540afa8a2712df323ef9a
    image: registry.lazycat.cloud/czyt/ggml-org/llama.cpp:943a4c5c31a68d50
    environment:
      - LLAMA_ARG_NO_FIT=true
      - LLAMA_ARG_N_GPU_LAYERS=16
      - LLAMA_ARG_MODELS_DIR=/models
{{if .U.models_preset}}
      - LLAMA_ARG_MODELS_PRESET={{.U.models_preset}}
{{end}}
{{if .U.api_key}}
      - LLAMA_API_KEY={{.U.api_key}}
{{end}}
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=15730
      - LLAMA_ARG_CTX_SIZE={{.U.context_size}}
    binds:
      - /lzcapp/var/models:/models
    healthcheck:
      disable: true
usage: |
  使用说明：
  1. 将 GGUF 模型文件放入 /lzcapp/var/models 目录
  2. 多模态模型需同时放入对应的 mmproj 投影文件
  3. API 请求时通过 model 字段指定模型文件名
  4. 部署后在浏览器中打开应用即可访问 Chat UI
  5. 模型热切换会产生短暂延迟，请确保内存余量充足
